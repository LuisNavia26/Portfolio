# Netlify config for alfredonavia.com — static site, no build step.
[build]
  publish = "."

# Old/explicit .html URLs and clean ones both work; Netlify serves
# /projects -> projects.html automatically ("Pretty URLs").

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Keep project notes out of the public site.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
